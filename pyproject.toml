[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-refinery-lite"
version = "0.1.0"
description = "A lightweight workbench for evaluating synthetic augmentation in low-data text classification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.18",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "tabulate>=0.9"
]

[project.scripts]
data-refinery = "data_refinery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
